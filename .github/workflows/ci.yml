name: CI

on:
  push:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: [cohort3, self-hosted]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: uv
      - uses: astral-sh/setup-uv@v2
      - name: Install dependencies
        run: uv sync --python 3.12
      - name: Ruff
        run: ruff check src tests scripts eval_cases
      - name: Compile
        run: python -m compileall -q src tests scripts eval_cases
      - name: Migration graph
        run: python -m alembic heads
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
      - name: Tests with coverage
        run: pytest -q --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=60
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///./data/ci.db
          AGENT_LLM_ENABLED: "false"
          AGENT_REWRITE_ENABLED: "false"
          OPENAI_API_KEY: test-only-placeholder
      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-${{ github.run_id }}
          path: coverage.xml
          if-no-files-found: warn

  frontend:
    runs-on: [cohort3, self-hosted]
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
