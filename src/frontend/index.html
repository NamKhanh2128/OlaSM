<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="Green SM Mobile App — Ứng dụng di động Green SM (VinGroup) tích hợp trợ lý giọng nói thông minh OlaSM Voice Core" />
    <meta name="theme-color" content="#00A699" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Green SM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <title>Green SM Mobile — Trợ lý giọng nói thông minh OlaSM</title>
    <script>
      // Áp class "dark" trước khi React mount để tránh nháy sáng->tối
      // (FOUC) khi người dùng đã chọn giao diện tối từ trước.
      (function () {
        try {
          const theme = window.localStorage.getItem("olasm_theme") || window.localStorage.getItem("alosm_theme");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (error) {
          // localStorage có thể bị chặn (chế độ riêng tư nghiêm ngặt) — bỏ qua,
          // ThemeProvider sẽ áp lại theme ngay khi React mount.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
