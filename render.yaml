# render.yaml — Blueprint for Render.com
# Reference: https://render.com/docs/blueprint-spec

services:
  # 1. FastAPI Web Backend
  - type: web
    name: olasm-backend
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    region: singapore
    plan: starter
    numInstances: 1
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: QUOTE_SIGNING_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. LiveKit Voice Agent Worker
  - type: worker
    name: olasm-voice-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    dockerCommand: python -m src.voice_agent.server dev
    region: singapore
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Worker needs the same full PostgreSQL DSN as the API service.
      # Configure these values in Render; a web-service host is not a DSN.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_MIGRATIONS
        sync: false
      - key: QUOTE_SIGNING_KEY
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_STT_PROVIDER
        value: livekit
      - key: LIVEKIT_STT_MODEL
        value: deepgram/nova-3
      - key: LIVEKIT_STT_LANGUAGE
        value: multi
      - key: LIVEKIT_LLM_PROVIDER
        value: openai
      - key: LIVEKIT_LLM_MODEL
        value: gpt-4.1-mini
      - key: LIVEKIT_TTS_PROVIDER
        value: google
      - key: LIVEKIT_TTS_MODEL
        value: gemini-2.5-flash-tts
      - key: LIVEKIT_TTS_VOICE
        value: Kore
      - key: LIVEKIT_TTS_LANGUAGE
        value: vi-VN
      - key: GOOGLE_CLOUD_PROJECT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
